version: 6.3.{build}
skip_tags: true
skip_branch_with_pr: true
image: Visual Studio 2022

branches:
    only:
    - main

skip_commits:
    files:
    - .config/
    - .github/
    - examples/
    - schemas/
    - src/

environment:
  nodejs_version: 24

install:
- choco install jq
- choco install dart-sdk
- refreshenv

build_script:
- cmd: nuget pack BancosBrasileiros.nuspec -Version %APPVEYOR_BUILD_VERSION%
- ps: $response=Invoke-RestMethod 'https://api.github.com/repos/guibranco/bancosbrasileiros/actions/artifacts?name=releaseNotesFile'
- ps: $releaseNotesUrl=$response.artifacts[0].archive_download_url
- ps: $headers = @{Authorization = "Bearer $env:GITHUB_TOKEN"}
- ps: Invoke-WebRequest -Uri $releaseNotesUrl -OutFile release-notes.zip -Headers $headers
- 7z x release-notes.zip
- ps: $env:release_notes=(Get-Content -Path "$pwd\release-notes.md" -Encoding UTF8 -Raw) -replace '\n', '\n'
- mkdir dart
- cd dart
- copy ..\analysis_options.yaml .
- copy ..\LICENSE .
- copy ..\pubspec.yaml .
- copy ..\README.md .
- mkdir example
- copy ..\examples\dart\bancos_brasileiros_example.dart example\
- mkdir assets
- copy ..\data\bancos.json assets\
- mkdir lib
- copy ..\lib\bancos_brasileiros.dart lib\
- cd lib
- mkdir src
- copy ..\..\lib\src\*.dart src\
- cd ..
- mkdir test
- copy ..\test\bancos_brasileiros_test.dart test\
- cd test
- mkdir resources
- copy ..\..\test\resources\*.json resources\
- cd ..
- ps: >-
    (Get-Content '.\pubspec.yaml') -replace '^version:.*', "version: $env:APPVEYOR_BUILD_VERSION" | Out-File '.\pubspec.yaml' -Encoding ASCII
- ps: |
    $v = (Select-String -Path '.\pubspec.yaml' -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
    if ($v -ne $env:APPVEYOR_BUILD_VERSION) { throw "pubspec version is $v, expected $env:APPVEYOR_BUILD_VERSION" }
- ps: |
    $notes = Get-Content -Path "..\release-notes.md" -Encoding UTF8 -Raw
    Set-Content -Path '.\CHANGELOG.md' -Value "## [$env:APPVEYOR_BUILD_VERSION]`n`n$notes" -Encoding UTF8
- C:\tools\dart-sdk\bin\dart pub get
- C:\tools\dart-sdk\bin\dart test
- C:\tools\dart-sdk\bin\dart pub publish --dry-run

artifacts:
- path: '**\*nupkg'
  name: Package

- path: 'data/bancos.json'
  name: Data

deploy:
- provider: NuGet
  api_key: $(NUGET_TOKEN)
  skip_symbols: false
  on:
   branch: main

- provider: GitHub
  on:
   branch: main
  tag: v$(appveyor_build_version)
  release: Release v$(appveyor_build_version)
  description: 'Release of Bancos Brasileiros - v$(appveyor_build_version) \n$(release_notes)'
  auth_token: $(GITHUB_TOKEN)
  force_update: true
  artifact: Package
