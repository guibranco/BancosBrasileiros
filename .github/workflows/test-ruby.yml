name: Test Ruby gem

on:
  pull_request:
    paths:
      - 'ruby/**'
      - 'data/bancos.json'
      - 'bancos_brasileiros.gemspec'
      - 'Rakefile'
      - 'Gemfile'
      - '.github/workflows/test-ruby.yml'
  push:
    branches: [main]
    paths:
      - 'ruby/**'
      - 'data/bancos.json'
      - 'bancos_brasileiros.gemspec'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Test
        run: ruby -Iruby/lib -e 'Dir["ruby/test/**/*_test.rb"].each { |f| require File.expand_path(f) }'

      - name: Build gem
        run: gem build bancos_brasileiros.gemspec
