name: SonarCloud

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Ruby
              uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
              with:
                  ruby-version: '3.3'

            - name: Run Ruby tests with coverage
              run: |
                  gem install simplecov --no-document
                  ruby -Iruby/lib -rsimplecov -e 'Dir["ruby/test/**/*_test.rb"].each { |f| require File.expand_path(f) }'

            - name: SonarCloud Scan
              uses: sonarsource/sonarqube-scan-action@v8.4.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
