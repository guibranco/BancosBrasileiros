name: SonarCloud

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Ruby
              uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
              with:
                  ruby-version: '3.3'

            - name: Run Ruby tests with coverage
              run: |
                  gem install simplecov --no-document
                  ruby -Iruby/lib -rsimplecov -e 'Dir["ruby/test/**/*_test.rb"].each { |f| require File.expand_path(f) }'

            # On pull requests, pass the PR coordinates explicitly so the scanner does not
            # auto-configure them through SonarCloud's GitHub lookup
            # (api/alm_integration/show_pullrequest), which intermittently fails with
            # "Something went wrong while trying to get the pullrequest with key ...".
            - name: Prepare SonarCloud arguments
              id: sonar-args
              shell: bash
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_HEAD: ${{ github.head_ref }}
                  PR_BASE: ${{ github.base_ref }}
              run: |
                  if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
                      echo "args=-Dsonar.pullrequest.key=${PR_NUMBER} -Dsonar.pullrequest.branch=${PR_HEAD} -Dsonar.pullrequest.base=${PR_BASE}" >> "${GITHUB_OUTPUT}"
                  else
                      echo "args=" >> "${GITHUB_OUTPUT}"
                  fi

            - name: SonarCloud Scan
              uses: sonarsource/sonarqube-scan-action@v8.5.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                  args: ${{ steps.sonar-args.outputs.args }}
