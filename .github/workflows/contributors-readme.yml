name: README.md contributors

on:
    push:
        branches:
            - main

jobs:
    contrib-readme-job:
        runs-on: ubuntu-latest
        name: Update files

        steps:
            - name: Contribute List
              uses: guibranco/github-contributors-readme-action@ee43b29920fefad71276c2428fb3297f2914066a # v2.3.12
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  readme_path: README.md

            - name: Contribute List
              uses: guibranco/github-contributors-readme-action@ee43b29920fefad71276c2428fb3297f2914066a # v2.3.12
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  readme_path: README.pt-br.md
