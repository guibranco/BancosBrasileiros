name: Publish to RubyGems

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 6.3.16'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.3'

      - name: Set gem version
        env:
          TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          sed -i -E "s/VERSION = \"[^\"]*\"/VERSION = \"${VERSION}\"/" ruby/lib/bancos_brasileiros_data/version.rb
          grep -q "VERSION = \"${VERSION}\"" ruby/lib/bancos_brasileiros_data/version.rb
          echo "GEM_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Test
        run: ruby -Iruby/lib -e 'Dir["ruby/test/**/*_test.rb"].each { |f| require File.expand_path(f) }'

      - name: Build gem
        run: gem build bancos_brasileiros_data.gemspec

      # Exchanges the GitHub OIDC token for a short-lived RubyGems API key.
      # Done by hand (instead of rubygems/configure-rubygems-credentials) because the
      # first push of a new gem must name the RubyGems.org account that will own it,
      # and no released version of that action sends the `owner` parameter yet.
      # RUBYGEMS_OWNER: the owning account's ID (shown on its Pending Trusted
      # Publishers page) or its handle. Not needed once the gem exists, but harmless.
      - name: Configure RubyGems credentials (trusted publishing)
        env:
          RUBYGEMS_OWNER: ${{ vars.RUBYGEMS_OWNER }}
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r '.value')
          payload=$(jq -n --arg jwt "$jwt" --arg owner "${RUBYGEMS_OWNER:-}" \
            '{jwt: $jwt} + (if $owner == "" then {} else {owner: $owner} end)')
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data "$payload" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          status=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          if [[ "$status" != 2* ]]; then
            echo "Trusted publisher token exchange failed (HTTP $status): $body" >&2
            exit 1
          fi
          key=$(jq -r '.rubygems_api_key' <<< "$body")
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Publish
        run: gem push "bancos_brasileiros_data-${GEM_VERSION}.gem"
