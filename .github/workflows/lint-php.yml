name: PHP Linting

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    php-lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Lint PHP files
              run: |
                  status=0
                  while IFS= read -r -d '' file; do
                      php -l "$file" || status=1
                  done < <(git ls-files -z -- '*.php')
                  exit "$status"
