name: Link checker

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: 0 0 * * 0

concurrency:
    group: links-checker
    cancel-in-progress: true

jobs:
    link-checker:
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        runs-on: ubuntu-26.04
        permissions:
            actions: write # required by the artifact lock (create/delete lock artifact)
            issues: write
            contents: read
            pull-requests: write

        steps:
            - uses: actions/checkout@v7

            - name: Check for relevant file changes
              uses: dorny/paths-filter@v4
              id: filter
              if: github.event_name == 'pull_request'
              with:
                  filters: |
                      relevant:
                          - 'data/**'
                          - '**/*.md'

            - name: Restore lychee cache
              if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
              uses: actions/cache@v6
              with:
                  path: .lycheecache
                  key: cache-lychee-${{ github.sha }}
                  restore-keys: cache-lychee-

            - name: Acquire WireGuard lock
              id: wireguard-lock
              if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
              uses: guibranco/github-artifact-lock-action@v3.0.24
              with:
                  lock-name: wireguard-tunnel
                  retry-wait: 30
                  retry-max: 40

            - name: Attach WireGuard connection
              id: wireguard
              if: steps.wireguard-lock.outcome == 'success'
              shell: bash
              env:
                  WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
              run: |
                  set -euo pipefail
                  if [[ -z "${WIREGUARD_CONFIG}" ]]; then
                      echo "::error::WIREGUARD_CONFIG secret is not available to this run."
                      exit 1
                  fi

                  sudo apt-get update -qq
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wireguard-tools

                  # wg-quick calls `resolvconf` to apply the DNS= setting. Ubuntu runners use
                  # systemd-resolved, so point `resolvconf` at resolvectl (its resolvconf
                  # compatibility mode) instead of installing the resolvconf package.
                  if ! command -v resolvconf > /dev/null; then
                      sudo ln -sf "$(command -v resolvectl)" /usr/local/sbin/resolvconf
                  fi

                  # Ubuntu 26 confines wg-quick with AppArmor, so it can only read configs
                  # from /etc/wireguard (a file in $RUNNER_TEMP fails with "Permission denied").
                  # Write it there directly, root-owned and 0600, without a copy in the workspace.
                  printf '%s\n' "${WIREGUARD_CONFIG}" | sudo install -D -m 600 -o root -g root /dev/stdin /etc/wireguard/wg0.conf
                  # Hosted runners have a jumbo-frame NIC (MTU 9000+), so wg-quick would derive
                  # an MTU of ~8921 for wg0. Packets that large are dropped on the internet path:
                  # DNS works but TLS handshakes stall (curl exit 35). Use WireGuard's standard
                  # 1420 unless the config sets its own MTU.
                  if ! sudo grep -qiE '^[[:space:]]*MTU[[:space:]]*=' /etc/wireguard/wg0.conf; then
                      sudo sed -i '/^\[Interface\]/a MTU = 1420' /etc/wireguard/wg0.conf
                  fi
                  sudo wg-quick up wg0

                  sudo wg show wg0 | grep -vi 'private key'
                  resolvectl status wg0 || true
                  if ! getent hosts www.bcb.gov.br > /dev/null; then
                      echo "::error::DNS resolution failed after bringing up the WireGuard tunnel."
                      exit 1
                  fi
                  if ! curl -sS -o /dev/null --max-time 30 https://api.github.com; then
                      echo "::error::HTTPS through the WireGuard tunnel failed (check MTU / peer routing)."
                      exit 1
                  fi
                  echo "WireGuard tunnel is up, DNS resolves and HTTPS works."

            - name: Run lychee
              if: steps.wireguard.outcome == 'success'
              uses: lycheeverse/lychee-action@v2.9.0
              id: lychee
              with:
                  args: '--root-dir "$(pwd)" --cache --max-cache-age 1d .'

            - name: Detach WireGuard connection
              shell: bash
              if: always() && steps.wireguard.outcome != 'skipped' && steps.wireguard-lock.outcome == 'success'
              run: |
                  if sudo test -f /etc/wireguard/wg0.conf; then
                      sudo wg-quick down wg0 || true
                      sudo rm -f /etc/wireguard/wg0.conf
                  fi

            - name: Release WireGuard lock
              # Only release a lock this run actually acquired, otherwise we would delete
              # the lock artifact held by another run.
              if: always() && steps.wireguard-lock.outcome == 'success'
              uses: guibranco/github-artifact-lock-action/release-lock@v3.0.24
              with:
                  lock-name: wireguard-tunnel

            - name: Create issue
              if: always() && github.event_name != 'pull_request' && steps.lychee.outcome != 'skipped' && steps.lychee.outputs.exit_code != 0
              uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6
              with:
                  title: 🔗✅ Link checker report
                  labels: |
                      🐛 bug
                      🔗 link checker
                      good first issue
                      help wanted
                      hacktoberfest
                  content-filepath: ./lychee/out.md

            - name: Update PR with comment
              uses: mshick/add-pr-comment@v3
              if: always() && github.event_name == 'pull_request' && steps.lychee.outcome != 'skipped' && steps.lychee.outputs.exit_code != 0
              with:
                  refresh-message-position: true
                  message-id: 'link-checker-result'
                  message-path: ./lychee/out.md
